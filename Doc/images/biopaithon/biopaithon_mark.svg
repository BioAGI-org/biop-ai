<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">BioPAIthon mark</title>
  <desc id="desc">Two intertwined snakes form a compact double helix; the blue snake is styled as a circuit trace.</desc>
  <defs>
    <clipPath id="yellow-over-1">
      <circle cx="78" cy="124" r="17"/>
    </clipPath>
    <clipPath id="yellow-over-2">
      <circle cx="184" cy="124" r="17"/>
    </clipPath>
  </defs>

  <!-- Yellow organic snake: the familiar biological strand. -->
  <path id="yellow-strand" d="M20 70 C52 70 62 180 96 180 C130 180 132 70 164 70 C196 70 202 180 232 180"
        fill="none" stroke="#FFD141" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blue silicon snake: a broad conductor with a fine inset trace. -->
  <path id="blue-strand" d="M20 180 C50 180 58 70 92 70 C126 70 130 180 164 180 C198 180 202 70 232 70"
        fill="none" stroke="#37709F" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 180 C50 180 58 70 92 70 C126 70 130 180 164 180 C198 180 202 70 232 70"
        fill="none" stroke="#A9D3EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Alternating crossovers make the two strands visibly intertwined. -->
  <use href="#yellow-strand" clip-path="url(#yellow-over-1)"/>
  <use href="#yellow-strand" clip-path="url(#yellow-over-2)"/>

  <!-- Circuit branches, pads, and vias. -->
  <g stroke="#37709F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 70 V44 H108" fill="none"/>
    <path d="M164 180 V207 H180" fill="none"/>
    <path d="M204 112 H225 V99" fill="none"/>
  </g>
  <g fill="#FFD141" stroke="#37709F" stroke-width="4">
    <circle cx="108" cy="44" r="6"/>
    <circle cx="180" cy="207" r="6"/>
    <circle cx="225" cy="99" r="6"/>
    <circle cx="92" cy="70" r="5"/>
    <circle cx="164" cy="180" r="5"/>
    <circle cx="204" cy="112" r="5"/>
  </g>

  <!-- Opposing heads preserve the original two-snake silhouette. -->
  <path d="M34 166 C24 158 10 161 6 174 C2 187 10 199 23 202 C31 204 38 197 45 189 C49 184 47 174 34 166 Z" fill="#37709F"/>
  <path d="M220 166 C231 158 245 161 250 174 C254 187 246 199 233 202 C225 204 217 197 210 189 C206 184 208 174 220 166 Z" fill="#FFD141"/>
  <g fill="#FFFFFF">
    <circle cx="18" cy="177" r="2.8"/>
    <circle cx="26" cy="185" r="2.8"/>
    <circle cx="230" cy="176" r="2.8"/>
    <circle cx="239" cy="184" r="2.8"/>
  </g>
</svg>
